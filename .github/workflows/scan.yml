name: Scan Writz positions

# Runs the Centinela scanner on a schedule and commits any changed
# data/*.json straight to main. This is the scheduler for the project -
# see README "Honest limits" for why this replaced the originally-planned
# always-on Fly worker (this session had no stored `fly` login, and the
# sandbox would not let the agent read or export a token to work around
# that). It uses only the repo's own built-in GITHUB_TOKEN - no secrets to
# configure.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: centinela-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci
      - run: npm run build
      - run: npm run scan

      - name: Commit updated data
        run: |
          git config user.name "centinela-bot"
          git config user.email "219895655+Eras256@users.noreply.github.com"
          git add data/positions.json data/history.json data/topics.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "scan: update positions ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            git push
          fi
